# Set root logger level to DEBUG and its only appender to console.
log4j.rootLogger=trace,console,rollingFile
# console is set to be a ConsoleAppender.
log4j.appender.console=org.apache.log4j.ConsoleAppender
# console uses PatternLayout.
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.Target = System.out
log4j.appender.console.Threshold = DEBUG
log4j.appender.console.layout.conversionPattern=%d{yyyy-MM-dd HH:mm:ss.SSS} %r [%t] %-5p %c.%M:%L %m%n

#log4j.appender.file=org.apache.log4j.FileAppender
log4j.appender.rollingFile=org.apache.log4j.RollingFileAppender
#log4j.appender.dailyRole=org.apache.log4j.DailyRollingFileAppender

#log4j.appender.file.layout=org.apache.log4j.PatternLayout
log4j.appender.rollingFile.layout=org.apache.log4j.PatternLayout
#log4j.appender.dailyRole.layout=org.apache.log4j.PatternLayout

#log4j.appender.file.layout.conversionPattern=%d{yyyy-MM-dd HH:mm:ss.SSS} %r [%t] %-5p%c %L %m%n
#log4j.appender.rollingFile.layout.conversionPattern=%d{yyyy-MM-dd HH:mm:ss.SSS} %r [%t] %-5p%c %L %m%n
log4j.appender.rollingFile.layout.conversionPattern=%d{yyyy-MM-dd HH:mm:ss.SSS} %r [%t] %-5p %c.%M:%L %m%n
#log4j.appender.dailyRole.layout.conversionPattern=%d{yyyy-MM-dd HH:mm:ss.SSS} %r [%t] %-5p%c %L %m%n

#log4j.appender.file.file=F:/logs/log4j.log
log4j.appender.rollingFile.file=F:/logs/log4j.log
#log4j.appender.dailyRole.file=F:/logs/log4j.log

#log4j.appender.file.encoding=UTF-8
log4j.appender.rollingFile.encoding=UTF-8
#log4j.appender.dailyRole.encoding=UTF-8

log4j.appender.rollingFile.maxFileSize=10MB
log4j.appender.rollingFile.maxBackupIndex=10

#log4j.appender.dailyRole.datePattern='.'yyyy-MM-dd HH:mm:ss
