#\u7B56\u7565\u6A21\u7248--1
#\u67E5\u8BE2\u73B0\u8D27\u7F51\u683C\u7B56\u7565\u6A21\u677F
strategyTemplates=/v1/gridSpotStrategyTemplates

#\u7F51\u683C--10
#\u521B\u5EFA\u73B0\u8D27\u7F51\u683C\u7B56\u7565
strategy.create=/v1/gridSpotOrders
#\u67E5\u8BE2\u73B0\u8D27\u7F51\u683C\u7B56\u7565\u5217\u8868
strategy.query=/v1/gridSpotOrders
#\u4FEE\u6539\u73B0\u8D27\u7F51\u683C
strategy.update=/v1/gridSpotOrders/{orderId}
#\u67E5\u8BE2\u73B0\u8D27\u7F51\u683C\u8BE6\u60C5
strategy.detail=/v1/gridSpotOrders/{orderId}
#\u67E5\u8BE2\u73B0\u8D27\u7F51\u683C\u4E0B\u7684\u59D4\u6258
strategy.entrust=/v1/gridSpotOrders/{orderId}/spotOrders
#\u542F\u52A8\u73B0\u8D27\u7F51\u683C
strategy.startup=/v1/gridSpotOrders/{orderId}/startup
#\u7EC8\u6B62\u73B0\u8D27\u7F51\u683C
strategy.terminate=/v1/gridSpotOrders/{orderId}/terminate
#\u67E5\u8BE2\u7F51\u683C\u4E0B\u7684\u6210\u4EA4\u8BB0\u5F55\u5217\u8868
strategy.transactions=/v1/gridSpotOrders/{orderId}/transactions
#\u67E5\u8BE2\u73B0\u8D27\u7F51\u683C\u8BA2\u5355\u4E0B\u7684\u4E8B\u4EF6\u8BB0\u5F55\u5217\u8868
strategy.events=/v1/gridSpotOrders/{orderId}/events
#\u67E5\u8BE2\u73B0\u8D27\u7F51\u683C\u8BA2\u5355\u4E0B\u7684\u6210\u4EA4\u8BB0\u5F55\u8BE6\u60C5 --\u8BE5\u63A5\u53E3\u540E\u7AEF\u672A\u5B9E\u73B0 \u7565
transactions.detail=/v1/gridSpotOrders/{orderId}/transactions/{groupId}

#\u8D44\u4EA7--5
#\u6309\u5E01\u79CD\u5206\u7C7B\u67E5\u8BE2\u8FD0\u884C\u4E2D\u7684\u73B0\u8D27\u7F51\u683C\u8BA2\u5355\u8D44\u4EA7
assets=/v1/gridSpotAssets
#\u67E5\u8BE2\u7528\u6237\u7F51\u683C\u8BA2\u5355\u4F59\u989D
order.balance=/v1/gridSpotAssets/{gridSpotOrderId}
#\u7F51\u683C\u603B\u8D44\u4EA7\u6536\u76CA
totalIncome=/v1/gridSpotAssets/total/grid
#\u7F51\u683C\u8D44\u4EA7\u5217\u8868
assets.list=/v1/gridSpotAssets/grid/list
#\u7F51\u683C\u8D44\u4EA7-\u5E01\u79CD\u8BE6\u60C5\u5217\u8868
assets.currency.list=/v1/gridSpotAssets/grid/desc

#\u73B0\u8D27\u57FA\u7840\u5E73\u53F0
#\u4E0B\u5355
spot.order=/spot/order
#\u64A4\u9500\u8BA2\u5355
order.repeal=/spot/order/repeal
#\u64A4\u9500\u5168\u90E8\u8BA2\u5355
order.repealAll=/spot/order/repeal-all
#\u64A4\u9500\u5168\u90E8\u8BA2\u5355\u7F51\u683C
grid.order.repealAll=/spot/order/repeal-all/grid





